<ion-content [fullscreen]="true">
  <main class="videos-screen">
    <header class="topbar">
      <button
        type="button"
        class="back-btn"
        routerLink="/informacion"
        (click)="registrarAccion('volver_informacion', 'informacion')">
        <ion-icon name="chevron-back"></ion-icon>
      </button>

      <h1>{{ t.titulo }}</h1>

      <button
        type="button"
        class="sos-btn"
        routerLink="/denuncia"
        (click)="registrarAccion('sos_denuncia', 'denuncia')">
        SOS
      </button>
    </header>

    <section class="content">
      <div class="videos-lang-switch">
        <button
          type="button"
          [class.active]="lang === 'es'"
          (click)="setLang('es')">
          ES
        </button>

        <button
          type="button"
          [class.active]="lang === 'en'"
          (click)="setLang('en')">
          EN
        </button>
      </div>

      <section class="hero-card">
        <div>
          <span class="hero-tag">{{ t.etiqueta }}</span>

          <h2>{{ t.titulo }}</h2>

          <p>{{ t.subtitulo }}</p>
        </div>

        <div class="hero-icon">
          <ion-icon name="play-circle"></ion-icon>
        </div>
      </section>

      <section class="notice-card">
        <strong>{{ t.avisoTitulo }}</strong>
        <span>{{ t.avisoTexto }}</span>
      </section>

      <section class="video-list">
        <article
          class="video-card"
          *ngFor="let video of videos; let i = index">

          <div class="video-frame">
            <iframe
              [src]="video.embedUrl"
              title="YouTube video player"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen>
            </iframe>
          </div>

          <div class="video-info">
            <h3>{{ video.titulo[lang] }}</h3>

            <p>{{ video.descripcion[lang] }}</p>

            <button
              type="button"
              (click)="abrirYoutube(video.youtubeUrl, i + 1)">
              {{ t.abrirYoutube }}
            </button>
          </div>
        </article>
      </section>
    </section>

    <nav class="bottom-nav">
      <button
        type="button"
        routerLink="/inicio"
        (click)="registrarAccion('nav_inicio', 'inicio')">
        <b><ion-icon name="home"></ion-icon></b>
        {{ t.inicio }}
      </button>

      <button
        type="button"
        routerLink="/denuncia"
        (click)="registrarAccion('nav_denuncia', 'denuncia')">
        <b><ion-icon name="alert-circle"></ion-icon></b>
        {{ t.denunciaNav }}
      </button>

      <button
        type="button"
        class="active"
        routerLink="/informacion"
        (click)="registrarAccion('nav_informacion', 'informacion')">
        <b><ion-icon name="book"></ion-icon></b>
        {{ t.info }}
      </button>

      <button
        type="button"
        routerLink="/apoyo"
        (click)="registrarAccion('nav_apoyo', 'apoyo')">
        <b><ion-icon name="chatbubble-ellipses"></ion-icon></b>
        {{ t.apoyo }}
      </button>
    </nav>
  </main>
</ion-content>
